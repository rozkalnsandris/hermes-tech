name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements.txt
            requirements-dev.txt

      - name: Probe cross-platform requirement hashes
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hermes-hash-probe"
          mkdir -p "$root/native" "$root/arm17" "$root/arm28" "$root/sdist"
          specs=(
            'pip==26.1.2'
            'setuptools==83.0.0'
            'certifi==2026.7.22'
            'charset-normalizer==3.4.9'
            'feedparser==6.0.12'
            'idna==3.18'
            'Pillow==12.3.0'
            'requests==2.34.2'
            'sgmllib3k==1.0.0'
            'urllib3==2.7.0'
          )
          for spec in "${specs[@]}"; do
            python -m pip download --disable-pip-version-check --no-deps --dest "$root/native" "$spec"
            python -m pip download --disable-pip-version-check --no-deps --no-binary=:all: --dest "$root/sdist" "$spec" || true
          done
          for spec in 'charset-normalizer==3.4.9' 'Pillow==12.3.0'; do
            python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --platform manylinux_2_17_aarch64 --python-version 311 --implementation cp --abi cp311 --dest "$root/arm17" "$spec" || true
            python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --platform manylinux_2_28_aarch64 --python-version 311 --implementation cp --abi cp311 --dest "$root/arm28" "$spec" || true
          done
          echo '=== HERMES HASH PROBE ==='
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum
          echo '=== END HERMES HASH PROBE ==='

      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync shellcheck

      - name: Install pinned Python environment
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-bootstrap.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --requirement requirements-dev.txt
          python -m pip check

      - name: Install pinned Hugo Extended
        run: |
          bash tools/install_hugo.sh "$RUNNER_TEMP/hugo/bin"
          echo "$RUNNER_TEMP/hugo/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          HERMES_TECH_ROOT: ${{ github.workspace }}
          HERMES_TECH_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/ci.sh

      - name: Real-browser static regression
        run: python tools/browser_smoke.py --root "$GITHUB_WORKSPACE"
