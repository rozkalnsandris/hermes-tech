name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements.txt
            requirements-dev.txt

      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync shellcheck

      - name: Install pinned Python environment
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-bootstrap.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --requirement requirements-dev.txt
          python -m pip check

      - name: Install pinned Hugo Extended
        run: |
          bash tools/install_hugo.sh "$RUNNER_TEMP/hugo/bin"
          echo "$RUNNER_TEMP/hugo/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          HERMES_TECH_ROOT: ${{ github.workspace }}
        run: bash tools/ci.sh

      - name: Compare baseline and refactored site visuals
        if: github.event_name == 'pull_request'
        env:
          HERMES_VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/compare_site_visuals.py \
            --base-sha "$HERMES_VISUAL_BASE_SHA" \
            --output "$RUNNER_TEMP/site-visuals"
