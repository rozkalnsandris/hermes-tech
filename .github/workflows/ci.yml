name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements.txt
            requirements-dev.txt

      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync shellcheck

      - name: Install pinned Python environment
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-bootstrap.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --requirement requirements-dev.txt
          python -m pip check

      - name: Install pinned Hugo Extended
        run: |
          bash tools/install_hugo.sh "$RUNNER_TEMP/hugo/bin"
          echo "$RUNNER_TEMP/hugo/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          HERMES_TECH_ROOT: ${{ github.workspace }}
        run: bash tools/ci.sh

  apply_branding_once:
    name: apply branding once
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/branding-tech-30' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v5
        with:
          ref: chore/branding-tech-30
          fetch-depth: 0
      - name: Apply and commit branding
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          block = '''<p align="center">
            <img src="assets/branding/project-logo.svg" alt="Hermes Tech logo" width="160">
          </p>

          '''
          if 'assets/branding/project-logo.svg' not in text:
              readme.write_text(block + text, encoding='utf-8')
          Path('.github/workflows/apply-branding-once.yml').unlink(missing_ok=True)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: add Hermes Tech project branding (#30) [branding-applied]"
          git push origin HEAD:chore/branding-tech-30
