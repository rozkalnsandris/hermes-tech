# SIMPLE-DEPLOY v1 consumer Compose. The :production tag is discovery/default metadata only.
# Runtime mutation must use the generic RPi5 deployer's frozen exact image@sha256 digest override.
services:
  hermes-tech:
    image: ghcr.io/rozkalnsandris/hermes-tech:production
    ports:
      - "${HERMES_TECH_ORIGIN_PORT:-1314}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
