<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon-v15.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-v15.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-v15.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48-v15.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v15.png">
<link rel="manifest" href="/site-v15.webmanifest">
<meta name="theme-color" content="#03101f">
<meta name="msapplication-TileColor" content="#03101f">
<meta name="msapplication-TileImage" content="/mstile-150x150-v15.png">
<meta name="msapplication-config" content="/browserconfig-v15.xml">
<title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:locale" content="en_US">
{{ if .Params.images }}
<meta property="og:image" content="{{ index .Params.images 0 | absURL }}">
<meta name="twitter:image" content="{{ index .Params.images 0 | absURL }}">
{{ else }}
<meta property="og:image" content="{{ "brand/hermes-tech-og-v15.jpg" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="{{ "brand/hermes-tech-og-v15.jpg" | absURL }}">
{{ end }}
<meta property="og:image:alt" content="Hermes Tech">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AlternativeOutputFormats }}<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
