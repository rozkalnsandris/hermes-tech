<svg viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" role="img" aria-label="Hermes Tech pipeline: RSS sources to SQLite to DeepSeek scoring and writing to a hype filter to Hugo build to Telegram and the website">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6373"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="920" fill="#0c0e12"/>

  <!-- ================= SOURCES ================= -->
  <g>
    <rect x="10"  y="16" width="192" height="58" rx="10" fill="#171b22" stroke="#4da3ff" stroke-width="1.4"/>
    <text x="106" y="40" text-anchor="middle" fill="#e9ecf2" font-size="13" font-weight="700">DevOps RSS</text>
    <text x="106" y="58" text-anchor="middle" fill="#8a93a6" font-size="11">~29 sources</text>

    <rect x="224" y="16" width="192" height="58" rx="10" fill="#171b22" stroke="#c084fc" stroke-width="1.4"/>
    <text x="320" y="40" text-anchor="middle" fill="#e9ecf2" font-size="13" font-weight="700">AI RSS</text>
    <text x="320" y="58" text-anchor="middle" fill="#8a93a6" font-size="11">~11 sources</text>

    <rect x="438" y="16" width="192" height="58" rx="10" fill="#171b22" stroke="#ffb454" stroke-width="1.4"/>
    <text x="534" y="40" text-anchor="middle" fill="#e9ecf2" font-size="13" font-weight="700">Agents RSS</text>
    <text x="534" y="58" text-anchor="middle" fill="#8a93a6" font-size="11">~9 sources</text>
  </g>

  <!-- converge lines to collector -->
  <path d="M106,74 L106,96 L320,96 L320,112" fill="none" stroke="#5c6373" stroke-width="1.3"/>
  <path d="M534,74 L534,96 L320,96" fill="none" stroke="#5c6373" stroke-width="1.3"/>
  <path d="M320,74 L320,112" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= COLLECTOR / SQLITE ================= -->
  <rect x="60" y="114" width="520" height="72" rx="12" fill="#171b22" stroke="#2a2f3a" stroke-width="1.2"/>
  <text x="320" y="146" text-anchor="middle" fill="#e9ecf2" font-size="15" font-weight="700">SQLite — full article text, deduped</text>
  <text x="320" y="166" text-anchor="middle" fill="#5c6373" font-size="11">collector.py · cron 06:15 / 12:15 / 18:15</text>

  <path d="M320,186 L320,208" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= DEEPSEEK ================= -->
  <rect x="60" y="210" width="520" height="78" rx="12" fill="#171b22" stroke="#2a2f3a" stroke-width="1.2"/>
  <text x="320" y="240" text-anchor="middle" fill="#e9ecf2" font-size="15" font-weight="700">DeepSeek V4 Flash</text>
  <text x="320" y="260" text-anchor="middle" fill="#8a93a6" font-size="12">scores top 5, writes digest in Hermes' voice</text>
  <text x="320" y="278" text-anchor="middle" fill="#5c6373" font-size="11">digest.py · cron 07:00 / 07:05 / 07:10</text>

  <path d="M320,288 L320,310" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= HYPE FILTER ================= -->
  <rect x="60" y="312" width="520" height="78" rx="12" fill="#171b22" stroke="#2a2f3a" stroke-width="1.2"/>
  <text x="320" y="342" text-anchor="middle" fill="#e9ecf2" font-size="15" font-weight="700">Hype filter</text>
  <text x="320" y="362" text-anchor="middle" fill="#8a93a6" font-size="12">rejects "revolutionary", "game changer" etc — 1 retry</text>
  <text x="320" y="380" text-anchor="middle" fill="#5c6373" font-size="11">unverified single-source claims are flagged, not dropped</text>

  <!-- retry loop -->
  <path d="M580,340 C 615,340 615,255 580,249" fill="none" stroke="#5c6373" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arrDash)"/>
  <text x="600" y="298" fill="#5c6373" font-size="10" transform="rotate(90 600 298)">retry once</text>

  <!-- branch: manual review -->
  <path d="M100,390 C 100,410 40,410 40,430" fill="none" stroke="#8a93a6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="8" y="432" width="230" height="46" rx="9" fill="#171b22" stroke="#8a93a6" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="123" y="451" text-anchor="middle" fill="#8a93a6" font-size="10.5" font-weight="700">🚫 still flagged after retry</text>
  <text x="123" y="466" text-anchor="middle" fill="#5c6373" font-size="10">auto-publish stops, Andris reviews</text>

  <!-- main path continues -->
  <path d="M320,390 L320,412" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= DIVERGE TO SECTIONS ================= -->
  <text x="320" y="432" text-anchor="middle" fill="#5c6373" font-size="11">passes filter → publish.sh &lt;section&gt;</text>

  <path d="M320,440 L320,456 L106,456 L106,472" fill="none" stroke="#5c6373" stroke-width="1.3"/>
  <path d="M320,440 L320,472" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M320,440 L320,456 L534,456 L534,472" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M106,456 L106,472" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="10"  y="474" width="192" height="52" rx="10" fill="#171b22" stroke="#4da3ff" stroke-width="1.4"/>
  <text x="106" y="505" text-anchor="middle" fill="#e9ecf2" font-size="12.5" font-weight="700">/digest/</text>

  <rect x="224" y="474" width="192" height="52" rx="10" fill="#171b22" stroke="#c084fc" stroke-width="1.4"/>
  <text x="320" y="505" text-anchor="middle" fill="#e9ecf2" font-size="12.5" font-weight="700">/ai/</text>

  <rect x="438" y="474" width="192" height="52" rx="10" fill="#171b22" stroke="#ffb454" stroke-width="1.4"/>
  <text x="534" y="505" text-anchor="middle" fill="#e9ecf2" font-size="12.5" font-weight="700">/agents/</text>

  <!-- converge to hugo -->
  <path d="M106,526 L106,548 L320,548 L320,564" fill="none" stroke="#5c6373" stroke-width="1.3"/>
  <path d="M534,526 L534,548 L320,548" fill="none" stroke="#5c6373" stroke-width="1.3"/>
  <path d="M320,526 L320,564" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= HUGO BUILD ================= -->
  <rect x="60" y="566" width="520" height="66" rx="12" fill="#171b22" stroke="#2a2f3a" stroke-width="1.2"/>
  <text x="320" y="594" text-anchor="middle" fill="#e9ecf2" font-size="15" font-weight="700">Hugo — static build</text>
  <text x="320" y="614" text-anchor="middle" fill="#5c6373" font-size="11">og-card generated (PIL) · git commit</text>

  <path d="M320,632 L320,654" fill="none" stroke="#5c6373" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ================= OUTPUTS ================= -->
  <rect x="120" y="656" width="180" height="60" rx="12" fill="#171b22" stroke="#4ade80" stroke-width="1.3"/>
  <text x="210" y="682" text-anchor="middle" fill="#e9ecf2" font-size="13" font-weight="700">Telegram</text>
  <text x="210" y="700" text-anchor="middle" fill="#5c6373" font-size="10.5">status + link</text>

  <rect x="340" y="656" width="180" height="60" rx="12" fill="#171b22" stroke="#4ade80" stroke-width="1.3"/>
  <text x="430" y="682" text-anchor="middle" fill="#e9ecf2" font-size="13" font-weight="700">tech.rozkalns.net</text>
  <text x="430" y="700" text-anchor="middle" fill="#5c6373" font-size="10.5">Cloudflare Tunnel</text>

  <path d="M320,632 L210,654" fill="none" stroke="#5c6373" stroke-width="1.1"/>
  <path d="M320,632 L430,654" fill="none" stroke="#5c6373" stroke-width="1.1"/>

  <!-- ================= FOOTNOTE ================= -->
  <line x1="60" y1="748" x2="580" y2="748" stroke="#171b22" stroke-width="1"/>
  <text x="320" y="782" text-anchor="middle" fill="#8a93a6" font-size="12" font-weight="700">Human in the loop</text>
  <text x="320" y="804" text-anchor="middle" fill="#5c6373" font-size="11">Andris reviews the live site and Telegram log.</text>
  <text x="320" y="822" text-anchor="middle" fill="#5c6373" font-size="11">Flagged drafts wait for him; everything else ships on its own.</text>

  <rect x="140" y="848" width="360" height="46" rx="10" fill="#12151b" stroke="#2a2f3a" stroke-width="1"/>
  <text x="320" y="877" text-anchor="middle" fill="#5c6373" font-size="11">cost: ~50 sources · 3 digests/day · under €1/month</text>
</svg>
