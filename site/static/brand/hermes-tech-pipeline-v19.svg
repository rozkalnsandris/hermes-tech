<svg viewBox="0 0 640 820" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" role="img" aria-label="Hermes Tech pipeline: RSS sources to SQLite, model scoring and writing, deterministic validation, section publishing, Hugo build, Telegram status and the website">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(11,31,51,0.88)"/>
      <stop offset="100%" stop-color="rgba(7,23,40,0.72)"/>
    </linearGradient>
    <linearGradient id="softLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f6f87"/>
      <stop offset="100%" stop-color="#7a89a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687892"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa0bb"/>
    </marker>
    <style>
      .panel { fill:url(#panelBg); stroke:#2f425d; stroke-width:1.2; filter:url(#shadow); }
      .txt-main { fill:#f4f7fb; font-size:15px; font-weight:700; }
      .txt-box { fill:#f4f7fb; font-size:13px; font-weight:700; }
      .txt-mid { fill:#a9bdd0; font-size:12px; }
      .txt-small { fill:#7588a2; font-size:11px; }
      .txt-mini { fill:#7588a2; font-size:10px; }
      .line { fill:none; stroke:url(#softLine); stroke-width:1.3; }
      .line-dash { fill:none; stroke:#8fa0bb; stroke-width:1.2; stroke-dasharray:3 4; }
      .devops { stroke:#4da3ff; stroke-width:1.4; }
      .ai { stroke:#d167ff; stroke-width:1.4; }
      .agents { stroke:#ffbc3e; stroke-width:1.4; }
      .out { stroke:#4ade80; stroke-width:1.3; }
      .flag { stroke:#8fa0bb; stroke-width:1.1; stroke-dasharray:3 4; }
    </style>
  </defs>

  <!-- ================= SOURCES ================= -->
  <g>
    <rect x="10" y="16" width="192" height="58" rx="12" class="panel devops"/>
    <text x="106" y="40" text-anchor="middle" class="txt-box">DevOps RSS</text>
    <text x="106" y="58" text-anchor="middle" class="txt-small">~29 sources</text>

    <rect x="224" y="16" width="192" height="58" rx="12" class="panel ai"/>
    <text x="320" y="40" text-anchor="middle" class="txt-box">AI RSS</text>
    <text x="320" y="58" text-anchor="middle" class="txt-small">~11 sources</text>

    <rect x="438" y="16" width="192" height="58" rx="12" class="panel agents"/>
    <text x="534" y="40" text-anchor="middle" class="txt-box">Agents RSS</text>
    <text x="534" y="58" text-anchor="middle" class="txt-small">~9 sources</text>
  </g>

  <path d="M106,74 L106,96 L320,96 L320,112" class="line"/>
  <path d="M534,74 L534,96 L320,96" class="line"/>
  <path d="M320,74 L320,112" class="line" marker-end="url(#arr)"/>

  <!-- ================= COLLECTOR / SQLITE ================= -->
  <rect x="60" y="114" width="520" height="72" rx="16" class="panel"/>
  <text x="320" y="146" text-anchor="middle" class="txt-main">SQLite — full article text, deduped</text>
  <text x="320" y="166" text-anchor="middle" class="txt-small">collector.py · cron 06:15 / 12:15 / 18:15</text>

  <path d="M320,186 L320,208" class="line" marker-end="url(#arr)"/>

  <!-- ================= MODEL ================= -->
  <rect x="60" y="210" width="520" height="78" rx="16" class="panel"/>
  <text x="320" y="240" text-anchor="middle" class="txt-main">DeepSeek V4 Flash</text>
  <text x="320" y="260" text-anchor="middle" class="txt-mid">scores top 5, writes digest in Hermes' voice</text>
  <text x="320" y="278" text-anchor="middle" class="txt-small">digest.py · cron 07:00 / 07:05 / 07:10</text>

  <path d="M320,288 L320,310" class="line" marker-end="url(#arr)"/>

  <!-- ================= VALIDATION ================= -->
  <rect x="60" y="312" width="520" height="86" rx="16" class="panel"/>
  <text x="320" y="340" text-anchor="middle" class="txt-main">Deterministic validation</text>
  <text x="320" y="361" text-anchor="middle" class="txt-mid">topic uniqueness · source checks · structure · language</text>
  <text x="320" y="381" text-anchor="middle" class="txt-small">bounded repair retry · unresolved failures are not published</text>

  <!-- failure path kept separate from the publication path -->
  <path d="M100,398 C100,410 48,410 48,424" class="line-dash" marker-end="url(#arrDash)"/>
  <rect x="8" y="426" width="230" height="50" rx="12" class="panel flag"/>
  <text x="123" y="447" text-anchor="middle" class="txt-mini" style="font-weight:700; fill:#a9bdd0;">still failing after retry</text>
  <text x="123" y="463" text-anchor="middle" class="txt-mini">category held · evidence for review</text>

  <!-- publication path -->
  <path d="M320,398 L320,446" class="line" marker-end="url(#arr)"/>
  <text x="430" y="421" text-anchor="middle" class="txt-small">passes gates → publish.sh &lt;section&gt;</text>

  <!-- ================= SECTIONS ================= -->
  <path d="M320,446 L320,478 L106,478 L106,494" class="line"/>
  <path d="M320,446 L320,494" class="line" marker-end="url(#arr)"/>
  <path d="M320,446 L320,478 L534,478 L534,494" class="line" marker-end="url(#arr)"/>
  <path d="M106,478 L106,494" class="line" marker-end="url(#arr)"/>

  <rect x="10" y="496" width="192" height="52" rx="12" class="panel devops"/>
  <text x="106" y="527" text-anchor="middle" class="txt-box">/digest/</text>

  <rect x="224" y="496" width="192" height="52" rx="12" class="panel ai"/>
  <text x="320" y="527" text-anchor="middle" class="txt-box">/ai/</text>

  <rect x="438" y="496" width="192" height="52" rx="12" class="panel agents"/>
  <text x="534" y="527" text-anchor="middle" class="txt-box">/agents/</text>

  <path d="M106,548 L106,560 L320,560 L320,570" class="line"/>
  <path d="M534,548 L534,560 L320,560" class="line"/>
  <path d="M320,548 L320,570" class="line" marker-end="url(#arr)"/>

  <!-- ================= HUGO BUILD ================= -->
  <rect x="60" y="572" width="520" height="66" rx="16" class="panel"/>
  <text x="320" y="600" text-anchor="middle" class="txt-main">Hugo — static build</text>
  <text x="320" y="620" text-anchor="middle" class="txt-small">og-card generated (PIL) · git commit</text>

  <path d="M320,638 L320,658" class="line" marker-end="url(#arr)"/>

  <!-- ================= OUTPUTS ================= -->
  <rect x="120" y="660" width="180" height="60" rx="14" class="panel out"/>
  <text x="210" y="686" text-anchor="middle" class="txt-box">Telegram</text>
  <text x="210" y="704" text-anchor="middle" class="txt-mini">status + link</text>

  <rect x="340" y="660" width="180" height="60" rx="14" class="panel out"/>
  <text x="430" y="686" text-anchor="middle" class="txt-box">tech.rozkalns.net</text>
  <text x="430" y="704" text-anchor="middle" class="txt-mini">Cloudflare Tunnel</text>

  <path d="M320,638 L210,658" class="line"/>
  <path d="M320,638 L430,658" class="line"/>

  <!-- ================= FOOTNOTE ================= -->
  <line x1="60" y1="756" x2="580" y2="756" stroke="#223248" stroke-width="1"/>
  <text x="320" y="785" text-anchor="middle" class="txt-mid" style="font-weight:700;">Human supervision</text>
  <text x="320" y="805" text-anchor="middle" class="txt-small">Policy and production approvals stay with Andris; passing digests may publish automatically.</text>
</svg>
