<svg viewBox="0 0 640 920" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" role="img" aria-label="Hermes Tech pipeline: RSS sources to SQLite to DeepSeek scoring and writing to a hype filter to Hugo build to Telegram and the website">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(11,31,51,0.88)"/>
      <stop offset="100%" stop-color="rgba(7,23,40,0.72)"/>
    </linearGradient>
    <linearGradient id="softLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f6f87"/>
      <stop offset="100%" stop-color="#7a89a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#687892"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa0bb"/>
    </marker>
    <style>
      .panel { fill:url(#panelBg); stroke:#2f425d; stroke-width:1.2; filter:url(#shadow); }
      .txt-main { fill:#f4f7fb; font-size:15px; font-weight:700; }
      .txt-box { fill:#f4f7fb; font-size:13px; font-weight:700; }
      .txt-mid { fill:#a9bdd0; font-size:12px; }
      .txt-small { fill:#7588a2; font-size:11px; }
      .txt-mini { fill:#7588a2; font-size:10px; }
      .line { fill:none; stroke:url(#softLine); stroke-width:1.3; }
      .line-dash { fill:none; stroke:#8fa0bb; stroke-width:1.2; stroke-dasharray:3 4; }
      .devops { stroke:#4da3ff; stroke-width:1.4; }
      .ai { stroke:#d167ff; stroke-width:1.4; }
      .agents { stroke:#ffbc3e; stroke-width:1.4; }
      .out { stroke:#4ade80; stroke-width:1.3; }
      .flag { stroke:#8fa0bb; stroke-width:1.1; stroke-dasharray:3 4; }
    </style>
  </defs>

  <!-- no full background: blends into page -->

  <!-- ================= SOURCES ================= -->
  <g>
    <rect x="10"  y="16" width="192" height="58" rx="12" class="panel devops"/>
    <text x="106" y="40" text-anchor="middle" class="txt-box">DevOps RSS</text>
    <text x="106" y="58" text-anchor="middle" class="txt-small">~29 sources</text>

    <rect x="224" y="16" width="192" height="58" rx="12" class="panel ai"/>
    <text x="320" y="40" text-anchor="middle" class="txt-box">AI RSS</text>
    <text x="320" y="58" text-anchor="middle" class="txt-small">~11 sources</text>

    <rect x="438" y="16" width="192" height="58" rx="12" class="panel agents"/>
    <text x="534" y="40" text-anchor="middle" class="txt-box">Agents RSS</text>
    <text x="534" y="58" text-anchor="middle" class="txt-small">~9 sources</text>
  </g>

  <path d="M106,74 L106,96 L320,96 L320,112" class="line"/>
  <path d="M534,74 L534,96 L320,96" class="line"/>
  <path d="M320,74 L320,112" class="line" marker-end="url(#arr)"/>

  <!-- ================= COLLECTOR / SQLITE ================= -->
  <rect x="60" y="114" width="520" height="72" rx="16" class="panel"/>
  <text x="320" y="146" text-anchor="middle" class="txt-main">SQLite — full article text, deduped</text>
  <text x="320" y="166" text-anchor="middle" class="txt-small">collector.py · cron 06:15 / 12:15 / 18:15</text>

  <path d="M320,186 L320,208" class="line" marker-end="url(#arr)"/>

  <!-- ================= DEEPSEEK ================= -->
  <rect x="60" y="210" width="520" height="78" rx="16" class="panel"/>
  <text x="320" y="240" text-anchor="middle" class="txt-main">DeepSeek V4 Flash</text>
  <text x="320" y="260" text-anchor="middle" class="txt-mid">scores top 5, writes digest in Hermes' voice</text>
  <text x="320" y="278" text-anchor="middle" class="txt-small">digest.py · cron 07:00 / 07:05 / 07:10</text>

  <path d="M320,288 L320,310" class="line" marker-end="url(#arr)"/>

  <!-- ================= HYPE FILTER ================= -->
  <rect x="60" y="312" width="520" height="78" rx="16" class="panel"/>
  <text x="320" y="342" text-anchor="middle" class="txt-main">Hype filter</text>
  <text x="320" y="362" text-anchor="middle" class="txt-mid">rejects "revolutionary", "game changer" etc — 1 retry</text>
  <text x="320" y="380" text-anchor="middle" class="txt-small">unverified single-source claims are flagged, not dropped</text>

  <path d="M580,340 C 615,340 615,255 580,249" class="line-dash" marker-end="url(#arrDash)"/>
  <text x="600" y="298" class="txt-mini" transform="rotate(90 600 298)">retry once</text>

  <path d="M100,390 C 100,410 40,410 40,430" class="line-dash"/>
  <rect x="8" y="432" width="230" height="46" rx="12" class="panel flag"/>
  <text x="123" y="451" text-anchor="middle" class="txt-mini" style="font-weight:700; fill:#a9bdd0;">still flagged after retry</text>
  <text x="123" y="466" text-anchor="middle" class="txt-mini">auto-publish stops, Andris reviews</text>

  <path d="M320,390 L320,412" class="line" marker-end="url(#arr)"/>

  <!-- ================= DIVERGE TO SECTIONS ================= -->
  <text x="320" y="432" text-anchor="middle" class="txt-small">passes filter → publish.sh &lt;section&gt;</text>

  <path d="M320,440 L320,456 L106,456 L106,472" class="line"/>
  <path d="M320,440 L320,472" class="line" marker-end="url(#arr)"/>
  <path d="M320,440 L320,456 L534,456 L534,472" class="line" marker-end="url(#arr)"/>
  <path d="M106,456 L106,472" class="line" marker-end="url(#arr)"/>

  <rect x="10"  y="474" width="192" height="52" rx="12" class="panel devops"/>
  <text x="106" y="505" text-anchor="middle" class="txt-box">/digest/</text>

  <rect x="224" y="474" width="192" height="52" rx="12" class="panel ai"/>
  <text x="320" y="505" text-anchor="middle" class="txt-box">/ai/</text>

  <rect x="438" y="474" width="192" height="52" rx="12" class="panel agents"/>
  <text x="534" y="505" text-anchor="middle" class="txt-box">/agents/</text>

  <path d="M106,526 L106,548 L320,548 L320,564" class="line"/>
  <path d="M534,526 L534,548 L320,548" class="line"/>
  <path d="M320,526 L320,564" class="line" marker-end="url(#arr)"/>

  <!-- ================= HUGO BUILD ================= -->
  <rect x="60" y="566" width="520" height="66" rx="16" class="panel"/>
  <text x="320" y="594" text-anchor="middle" class="txt-main">Hugo — static build</text>
  <text x="320" y="614" text-anchor="middle" class="txt-small">og-card generated (PIL) · git commit</text>

  <path d="M320,632 L320,654" class="line" marker-end="url(#arr)"/>

  <!-- ================= OUTPUTS ================= -->
  <rect x="120" y="656" width="180" height="60" rx="14" class="panel out"/>
  <text x="210" y="682" text-anchor="middle" class="txt-box">Telegram</text>
  <text x="210" y="700" text-anchor="middle" class="txt-mini">status + link</text>

  <rect x="340" y="656" width="180" height="60" rx="14" class="panel out"/>
  <text x="430" y="682" text-anchor="middle" class="txt-box">tech.rozkalns.net</text>
  <text x="430" y="700" text-anchor="middle" class="txt-mini">Cloudflare Tunnel</text>

  <path d="M320,632 L210,654" class="line"/>
  <path d="M320,632 L430,654" class="line"/>

  <!-- ================= FOOTNOTE ================= -->
  <line x1="60" y1="748" x2="580" y2="748" stroke="#223248" stroke-width="1"/>
  <text x="320" y="782" text-anchor="middle" class="txt-mid" style="font-weight:700;">Human in the loop</text>
  <text x="320" y="804" text-anchor="middle" class="txt-small">Andris reviews the live site and Telegram log.</text>
  <text x="320" y="822" text-anchor="middle" class="txt-small">Flagged drafts wait for him; everything else ships on its own.</text>

  <rect x="140" y="848" width="360" height="46" rx="12" class="panel"/>
  <text x="320" y="877" text-anchor="middle" class="txt-small">cost: ~50 sources · 3 digests/day · under €1/month</text>
</svg>
