baseURL = "https://tech.rozkalns.net/"
locale = "en"
title = "Hermes Tech"
timeZone = "Europe/Berlin"
enableRobotsTXT = true

[pagination]
  disableAliases = true
  pagerSize = 10
  path = "page"

[params]
  description = "A self-hosted, openly AI-generated technology digest for DevOps, AI, and agent engineering."
  tagline = "The technology is not the story. The engineering behind it is."

[markup.goldmark.renderer]
  unsafe = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
